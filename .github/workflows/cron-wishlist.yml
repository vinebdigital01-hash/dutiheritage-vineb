name: 6-Hour Wishlist Cron

on:
  schedule:
    - cron: '0 */6 * * *' # Every 6 hours
  workflow_dispatch:

jobs:
  run-cron:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Wishlist Reminders API
        run: |
          curl -X GET "${{ secrets.SITE_URL }}/api/cron/wishlist-reminders" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            --fail
